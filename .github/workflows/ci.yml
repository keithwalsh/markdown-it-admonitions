name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (markdown-it ${{ matrix.markdown-it }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        markdown-it: ['13', '14', '15']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Install markdown-it ${{ matrix.markdown-it }}
        run: npm install --no-save markdown-it@${{ matrix.markdown-it }}

      - name: Run tests
        run: npm test
